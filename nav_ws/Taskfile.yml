version: '3'

tasks:
  build:
    cmds:
      - colcon build --symlink-install

  clean:
    cmds:
      - rm -rf build install log

  clean-ros:
    cmds:
      - rm -r ~/.ros

  clean-all:
    deps:
      - clean
      - clean-ros

  nav:
    cmds:
      - |
        source install/setup.sh
        ros2 launch penguin_nav nav.launch.xml
