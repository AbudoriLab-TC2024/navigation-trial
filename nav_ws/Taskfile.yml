version: '3'

tasks:
  build:
    cmds:
      - colcon build --symlink-install

  clean:
    cmds:
      - rm -rf build install log

  clean-ros:
    cmds:
      - rm -r ~/.ros

  clean-all:
    deps:
      - clean
      - clean-ros

  nav:
    cmds:
      - |
        source install/setup.sh
        ros2 launch penguin_nav nav.launch.xml

  sim:
    cmds:
      - |
        export TURTLEBOT3_MODEL=waffle
        source install/setup.sh
        ros2 launch penguin_bringup_sim sim.launch.xml log_level:=info

  run:
    cmds:
      - |
        source ./install/setup.sh
        sleep 7
        ros2 run penguin_nav follow_path.py -- path.csv

  bringup:
    deps:
      - sim
      - run
